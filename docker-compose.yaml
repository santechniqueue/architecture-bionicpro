services:
  ldap:
    build:
      context: ./ldap
      dockerfile: Dockerfile
    environment:
      LDAP_ORGANISATION: BionicPRO Foreign Office
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_TLS: "false"
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=com' -w admin -b 'dc=example,dc=com' '(objectClass=*)' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_DEBUG: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      ldap:
        condition: service_healthy

  keycloak-ldap-init:
    image: quay.io/keycloak/keycloak:21.1
    depends_on:
      - keycloak
      - ldap
    volumes:
      - ./keycloak/configure-ldap.sh:/opt/keycloak/configure-ldap.sh
    entrypoint: ["/bin/sh", "/opt/keycloak/configure-ldap.sh"]

  keycloak-mfa-init:
    image: quay.io/keycloak/keycloak:21.1
    depends_on:
      keycloak:
        condition: service_started
      keycloak-ldap-init:
        condition: service_completed_successfully
    volumes:
      - ./keycloak/configure-mfa.sh:/opt/keycloak/configure-mfa.sh:ro
    entrypoint: [ "/bin/sh", "/opt/keycloak/configure-mfa.sh" ]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      FRONTEND_URL: http://localhost:3000
      REPORTS_API_URL: http://reports-api:8001
      KEYCLOAK_INTERNAL_BASE_URL: http://host.docker.internal:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: super-secret-auth-client
      SESSION_COOKIE_NAME: bp_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: lax
      SESSION_TTL_SECONDS: "1800"
      REDIS_URL: redis://redis:6379/0
      REFRESH_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ROTATE_SESSION_EVERY_REQUEST: "true"
      REFRESH_ACCESS_TOKEN_SKEW_SECONDS: "15"
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
      - redis
      - reports-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
